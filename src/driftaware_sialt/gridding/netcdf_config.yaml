variables:
  da: # drift-aware
    histogram: True
    include:
      - "{{ target_var }}"
      - "{{ target_var }}_parcel_unc"
      - "{{ target_var }}_drift_unc"
      - "{{ target_var }}_growth_unc"
      - "{{ target_var }}_total_unc"
      #- "{{ target_var }}_mode"
      - "{{ target_var }}_uncorrected"
      - "growth"
      - "growth_interpolated"
      - "dist_acquisition"
      - "dt_days"
      - "ice_conc"
      - "deformation"
      - "shear"
      - "divergence"
      - "{{ target_var }}_dynamic_tendency"
      - "thermo_change_rate"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "snow_depth"
      - "sit_corr_thermo_mod"
      - "rate_thermo_change_mod"
      - "rate_thermo_growth_mod"
      - "drift_unc"
      - "ohf"
      - "t2m"
      - "sentinel3a"
      - "sentinel3b"
      - "cryosat2"
      - "sentinel3a_cnt"
      - "sentinel3b_cnt"
      - "cryosat2_cnt"
      #- "nb_tiepoints"
      #- "drift_unc"
    rename:
      - "{{ target_var }}"
      - "{{ target_var }}_parcel_unc"
      - "{{ target_var }}_drift_unc"
      - "{{ target_var }}_change_unc"
      - "{{ target_var }}_total_unc"
      #- "{{ target_var }}_mode"
      - "{{ target_var }}_uncorrected"
      - "{{ target_var }}_change"
      - "{{ target_var }}_change_interpolated"
      - "dist_acquisition"
      - "time_offset_acquisition"
      - "sea_ice_concentration"
      - "deformation"
      - "shear"
      - "divergence"
      - "{{ target_var }}_dynamic_tendency"
      - "sea_ice_thickness_thermodynamic_tendency"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "snow_depth"
      - "model_sea_ice_thickness"
      - "model_sea_ice_thickness_thermodynamic_correction_rate"
      - "model_sea_ice_thickness_thermodynamic_tendency"
      - "sea_ice_displacement_uncertainty"
      - "model_ocean_heat_flux"
      - "model_air_temperature"
      - "sentinel3a_frac"
      - "sentinel3b_frac"
      - "cryosat2_frac"
      - "sentinel3a_cnt"
      - "sentinel3b_cnt"
      - "cryosat2_cnt"
      #- "nb_tiepoints"
      #- "drift_unc"

  cv: # conventional
    histogram: True
    include:
      - "{{ target_var }}"
      - "{{ target_var }}_parcel_unc"
      - "{{ target_var }}_mode"
      - "dist_acquisition"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "dt_days"
      - "ice_conc"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "sentinel3a"
      - "sentinel3b"
      - "cryosat2"
      - "sentinel3a_cnt"
      - "sentinel3b_cnt"
      - "cryosat2_cnt"
    rename:
      - "{{ target_var }}"
      - "{{ target_var }}_parcel_unc"
      - "{{ target_var }}_mode"
      - "dist_acquisition"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "time_offset_acquisition"
      - "sea_ice_concentration"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "sentinel3a_frac"
      - "sentinel3b_frac"
      - "cryosat2_frac"
      - "sentinel3a_cnt"
      - "sentinel3b_cnt"
      - "cryosat2_cnt"
      #- "nb_tiepoints"

variable_attributes:
  xc:
    standard_name: "projection_x_coordinate"
    long_name: "x coordinate of projection (eastings)"
    units: "m"

  yc:
    standard_name: "projection_y_coordinate"
    long_name: "y coordinate of projection (northings)"
    units: "m"

  hist_bins:
    long_name: "histogram bin centers"
    units: "m"

  latitude:
    standard_name: "latitude"
    long_name: "latitude of grid cell center"
    units: "degrees_north"

  longitude:
    standard_name: "longitude"
    long_name: "longitude of grid cell center"
    units: "degrees_east"

  sea_ice_concentration:
    standard_name: 'sea_ice_area_fraction'
    long_name: "sea ice concentration"
    coordinates: "time longitude latitude"
    units: "percent"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness:
    standard_name: 'sea_ice_thickness'
    long_name: "sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    ancillary_variables: "sea_ice_thickness_parcel_unc sea_ice_thickness_drift_unc sea_ice_thickness_change_unc sea_ice_thickness_total_unc"
    comment: ""

  sea_ice_thickness_std:
    standard_name: 'sea_ice_thickness'
    long_name: "standard deviation of sea ice thickness estimates within parcel"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_mode:
    standard_name: 'sea_ice_thickness'
    long_name: "modal sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_hist:
    long_name: "Counts per thickness class for classes between 0 m and 10 m with 0.25m bin size"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    comment: "grid cells contain the absolute counts for each bin"

  sea_ice_thickness_change:
    long_name: "rate of change in sea ice thickness per day"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_change_interpolated:
    long_name: "spatially interpolated rate of change in sea ice thickness per day"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_uncorrected:
    standard_name: 'sea_ice_thickness'
    long_name: "sea ice thickness before temporal change correction"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_drift_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the ice drift correction"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_change_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the rate of change in sea ice thickness per day"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_parcel_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "propagated uncertainty of the parcel-mean sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_total_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "combined sea ice thickness uncertainty"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  radar_freeboard:
    long_name: "radar freeboard"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_freeboard:
    standard_name: 'sea_ice_freeboard'
    long_name: "sea ice freeboard"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  snow_depth:
    standard_name: 'surface_snow_thickness'
    long_name: "thickness of the snow layer"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  model_sea_ice_thickness:
    standard_name: 'sea_ice_thickness'
    long_name: "sea ice thickness propagated by the thermodynamic model"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: ""

  sea_ice_thickness_thermodynamic_tendency:
    standard_name: 'tendency_of_sea_ice_thickness_due_to_thermodynamics'
    long_name: "thermodynamic tendency of sea ice thickness inferred from observed thickness change and ice divergence"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_dynamic_tendency:
    standard_name: 'tendency_of_sea_ice_thickness_due_to_dynamics'
    long_name: "sea ice thickness tendency due to ice dynamics"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: "Calculated from sea ice thickness and drift divergence."

  model_sea_ice_thickness_thermodynamic_correction_rate:
    long_name: "modeled thermodynamic sea ice thickness correction rate along the trajectory direction"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: "The sign follows the forward or reverse trajectory direction."

  model_sea_ice_thickness_thermodynamic_tendency:
    standard_name: 'tendency_of_sea_ice_thickness_due_to_thermodynamics'
    long_name: "modeled forward-time thermodynamic tendency of sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: ""

  model_air_temperature:
    standard_name: 'air_temperature'
    long_name: "air temperature used by the thermodynamic model"
    coordinates: "time longitude latitude"
    units: "degree_Celsius"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: ""

  model_ocean_heat_flux:
    standard_name: 'upward_sea_ice_basal_heat_flux'
    long_name: "ocean heat flux used by the thermodynamic model"
    coordinates: "time longitude latitude"
    units: "W m-2"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: "Positive values reduce modeled sea ice growth."

  sea_ice_displacement_uncertainty:
    standard_name: 'magnitude_of_sea_ice_displacement standard_error'
    long_name: "uncertainty of the accumulated sea ice parcel displacement along the trajectory"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  deformation:
    long_name: "mean total sea ice deformation rate sampled along the trajectory"
    coordinates: "time longitude latitude"
    units: "day-1"
    grid_mapping: 'crs'
    comment: "Magnitude calculated from the divergence and shear strain-rate invariants."

  divergence:
    standard_name: 'divergence_of_sea_ice_velocity'
    long_name: "mean sea ice velocity divergence sampled along the trajectory"
    coordinates: "time longitude latitude"
    units: "day-1"
    grid_mapping: 'crs'
    comment: ""

  shear:
    long_name: "mean sea ice horizontal shear strain rate sampled along the trajectory"
    coordinates: "time longitude latitude"
    units: "day-1"
    grid_mapping: 'crs'
    comment: "No corresponding CF-1.6 standard name is available."

  dist_acquisition:
    standard_name: 'magnitude_of_sea_ice_displacement'
    long_name: "distance between target day and day of data acquisition location"
    coordinates: "time longitude latitude"
    units: "km"
    grid_mapping: 'crs'
    comment: "Straight-line displacement from the acquisition location to the target location."

  time:
    standard_name: 'time'
    long_name: 'time'
    axis: "T"
    bounds: "time_bnds"
    calendar: "standard"
    units: 'seconds since 1970-01-01 00:00:00'

  time_bnds:
    long_name: "time bounds"
    units: 'seconds since 1970-01-01 00:00:00'

  time_offset_acquisition:
    long_name: "time offset of acquisition relative to target time"
    coordinates: "time longitude latitude"
    units: "days"
    grid_mapping: 'crs'
    comment: "Negative values indicate acquisition before the target time; positive values indicate acquisition after it."

  sentinel3a_frac:
    long_name: "fractional contribution of Sentinel-3A observations"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    valid_min: 0.0
    valid_max: 1.0
    comment: "Fraction of contributing observations associated with Sentinel-3A."

  sentinel3b_frac:
    long_name: "fractional contribution of Sentinel-3B observations"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    valid_min: 0.0
    valid_max: 1.0
    comment: "Fraction of contributing observations associated with Sentinel-3B."

  cryosat2_frac:
    long_name: "fractional contribution of CryoSat-2 observations"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    valid_min: 0.0
    valid_max: 1.0
    comment: "Fraction of contributing observations associated with CryoSat-2."

  sentinel3a_cnt:
    long_name: "number of contributing Sentinel-3A observations"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    valid_min: 0.0
    comment: ""

  sentinel3b_cnt:
    long_name: "number of contributing Sentinel-3B observations"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    valid_min: 0.0
    comment: ""

  cryosat2_cnt:
    long_name: "number of contributing CryoSat-2 observations"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    valid_min: 0.0
    comment: ""
