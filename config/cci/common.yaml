# Relative paths are resolved from base_dir; absolute paths are also accepted.
# {version} and {sensor} are expanded when the configuration is loaded.
base_dir: "/Volumes/Files/Forskningsdata/600/60090/105517-CCI+SeaIce"

# Output paths below turn 1.1 into v1.1.
version: 1.1

# Supported sensors: envisat, cryosat2, sentinel3a, sentinel3b, icesat2.
input_dir:
  envisat: "input/altimetry/l2p/nh/envisat"
  cryosat2: "input/altimetry/l2p/nh/cryosat2"
  sentinel3a: "input/altimetry/l2p/nh/sentinel3a"
  sentinel3b: "input/altimetry/l2p/nh/sentinel3b"
  icesat2:
    total_freeboard: "input/icesat2/ATL10.005"
    sea_ice_thickness: "input/icesat2/is2sitdata"

# Run-specific subdirectories are created automatically.
output_dir:
  trajectories: "output/v{version}/trajectories/{sensor}"
  gridded_data: "output/v{version}/l3c/{sensor}"
  visu: "output/v{version}/visualization/{sensor}"

# Product keys selected under options must have a directory here.
auxiliary:
  # Supported readers: osi450, osi430, c3s.
  ice_conc:
    osi450: "input/ice_conc/osi450"
    osi430: "input/ice_conc/osi430"
    # c3s: "input/ice_conc/c3s"

  # Supported readers: osi455, osi435, osi405.
  ice_drift:
    osi455: "input/ice_drift/osi455"
    osi435: "input/ice_drift/osi435"
    osi405: "input/ice_drift/osi405"

  reg_mask:
    nh: "input/auxiliary/region_mask/NSIDC-0780_SeaIceRegions_EASE2-N12.5km_v1.0.nc"
    sh: "input/auxiliary/region_mask/NSIDC-0780_SeaIceRegions_EASE2-S12.5km_v1.0.nc"

  # ERA5 is currently the supported air-temperature product.
  t2m:
    era5:
      nh: "input/auxiliary/air_temperature/ERA5/nh"
      sh: "input/auxiliary/air_temperature/ERA5/sh"

  ohf:
    sose: "input/auxiliary/ocean_heat_flux/SOSE/OHF_compute/iter156/5DAY/DAILY"

  # Keep the shapefile's .shx, .dbf, and .prj files beside the .shp file.
  land_mask: "input/auxiliary/land_mask/ne_50m_land.shp"

logging: "logging"

options:
  # One or more supported sensors, e.g. [cryosat2, sentinel3a, sentinel3b].
  sensor: [cryosat2]

  # Options depend on sensor; see the configuration reference in README.md.
  target_variable: sea_ice_thickness

  # Additional source variables to retain; use [] for none.
  add_variable: [snow_depth]

  # nh uses EPSG:6931; sh uses EPSG:6932.
  hemisphere: nh
  out_epsg: "EPSG:6931"

  # Priority ordered; the temporal fallback is limited to seven days.
  ice_conc_products: [osi450, osi430]
  ice_drift_products: [osi455, osi435]
