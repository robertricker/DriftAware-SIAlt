variables:
  da: # drift-aware
    histogram: True
    include:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_drift_unc"
      - "{{ target_var }}_growth_unc"
      - "{{ target_var }}_total_unc"
      #- "{{ target_var }}_mode"
      #- "{{ target_var }}_uncorrected"
      - "growth"
      - "growth_interpolated"
      - "dist_acquisition"
      - "dt_days"
      - "ice_conc"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "sit_corr_thermo_mod"
      - "rate_thermo_change_mod"
      - "rate_thermo_growth_mod"
      - "sea_ice_volume"
      - "sea_ice_mass"
      - "sea_ice_extent"
      - "sea_ice_area"
      - "sea_ice_extent_total"
      - "sea_ice_area_total"
      - "sea_ice_volume_total"
      - "sea_ice_mass_total"
      - "snow_volume"
      - "snow_mass"
      #- "drift_unc"
    rename:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_drift_unc"
      - "{{ target_var }}_change_unc"
      - "{{ target_var }}_total_unc"
      #- "{{ target_var }}_mode"
      #- "{{ target_var }}_uncorrected"
      - "{{ target_var }}_change"
      - "{{ target_var }}_change_interpolated"
      - "dist_acquisition"
      - "time_offset_acquisition"
      - "sea_ice_concentration"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "model_sea_ice_thickness"
      - "model_sea_ice_thickness_change_rate"
      - "model_sea_ice_thickness_thermodynamic_tendency"
      - "sea_ice_volume"
      - "sea_ice_mass"
      - "snow_volume"
      - "snow_mass"
      #- "drift_unc"

  cv: # conventional
    histogram: True
    include:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_mode"
      - "dist_acquisition"
      - "dt_days"
      - "ice_conc"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "sea_ice_volume"
      - "sea_ice_mass"
      - "sea_ice_extent"
      - "sea_ice_area"
      - "sea_ice_extent_total"
      - "sea_ice_area_total"
      - "sea_ice_volume_total"
      - "sea_ice_mass_total"
      - "snow_volume"
      - "snow_mass"
    rename:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_mode"
      - "dist_acquisition"
      - "time_offset_acquisition"
      - "sea_ice_concentration"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "sea_ice_volume"
      - "sea_ice_mass"
      - "snow_volume"
      - "snow_mass"

variable_attributes:
  xc:
    standard_name: "projection_x_coordinate"
    long_name: "x coordinate of projection (eastings)"
    units: "m"

  yc:
    standard_name: "projection_y_coordinate"
    long_name: "y coordinate of projection (northings)"
    units: "m"

  hist_bins:
    standard_name: "bin_centers"
    long_name: "histogram bin centers"
    units: "m"

  latitude:
    standard_name: "latitude"
    long_name: "latitude of grid cell center"
    units: "degrees_north"

  longitude:
    standard_name: "longitude"
    long_name: "time longitude of grid cell center"
    units: "degrees_east"

  sea_ice_concentration:
    standard_name: 'sea_ice_area_fraction'
    long_name: "sea ice concentration"
    coordinates: "time longitude latitude"
    units: "percent"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness:
    standard_name: 'sea_ice_thickness'
    long_name: "sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_volume:
    standard_name: 'sea_ice_volume'
    long_name: "sea ice volume"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_mass:
      standard_name: 'sea_ice_mass'
      long_name: "sea ice mass"
      coordinates: "time longitude latitude"
      units: "m"
      grid_mapping: 'crs'
      comment: ""


  sea_ice_thickness_std:
    standard_name: 'sea_ice_thickness'
    long_name: "standard deviation of sea ice thickness estimates within parcel"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_mode:
    standard_name: 'sea_ice_thickness'
    long_name: "modal sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_hist:
    standard_name: 'sea_ice_thickness'
    long_name: "thickness classes between 0 m and 10 m with 0.25m bin size"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    comment: "grid cells contain the absolute counts for each bin"

  sea_ice_thickness_change:
    long_name: "sea ice thickness change rate estimated along trajectories"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_change_interpolated:
    long_name: "spatially interpolated sea ice thickness change rate"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_drift_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the ice drift correction"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_change_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the interpolated thickness change correction"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_l2_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the level2 product"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_total_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "combined sea ice thickness uncertainty"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  snow_depth:
    standard_name: 'surface_snow_thickness_where_sea_ice'
    long_name: "thickness of the snow layer"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  snow_volume:
    standard_name: 'surface_snow_volume_where_sea_ice'
    long_name: "volume of the snow layer"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""
  sea_ice_extent:
    standard_name: 'sea_ice_extent'
    long_name: "sea ice extent per cell"
    coordinates: "time longitude latitude"
    units: "m2"
    grid_mapping: 'crs'
    comment: "Cell area when concentration exceeds the threshold"
  sea_ice_area:
    standard_name: 'sea_ice_area'
    long_name: "sea ice area per cell"
    coordinates: "time longitude latitude"
    units: "m2"
    grid_mapping: 'crs'
    comment: "Sea ice area within the cell based on concentration fraction"
  sea_ice_extent_total:
    standard_name: 'sea_ice_extent'
    long_name: "total sea ice extent"
    units: "m2"
    comment: "Total sea ice extent over the domain"
  sea_ice_area_total:
    standard_name: 'sea_ice_area'
    long_name: "total sea ice area"
    units: "m2"
    comment: "Total sea ice area over the domain"
  sea_ice_volume_total:
    standard_name: 'sea_ice_volume'
    long_name: "total sea ice volume"
    units: "m3"
    comment: "Total sea ice volume over the domain"
  sea_ice_mass_total:
    standard_name: 'sea_ice_mass'
    long_name: "total sea ice mass"
    units: "kg"
    comment: "Total sea ice mass over the domain"
  snow_mass:
    standard_name: 'surface_snow_mass_where_sea_ice'
    long_name: "mass of the snow layer"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_displacement_uncertainty:
    long_name: "uncertainty of the accumulated sea ice parcel displacement along the trajectory"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  deformation:
    standard_name: 'deformation'
    long_name: "mean deformation accumulated along the trajectory"
    coordinates: "time longitude latitude"
    units: "1/day"
    grid_mapping: 'crs'
    comment: ""

  divergence:
    standard_name: 'divergence'
    long_name: "mean divergence accumulated along the trajectory"
    coordinates: "time longitude latitude"
    units: "1/day"
    grid_mapping: 'crs'
    comment: ""

  shear:
    standard_name: 'shear'
    long_name: "mean shear accumulated along the trajectory"
    coordinates: "time longitude latitude"
    units: "1/day"
    grid_mapping: 'crs'
    comment: ""

  dist_acquisition:
    standard_name: 'geospatial_distance'
    long_name: "distance between target day and day of data acquisition location"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  time:
    standard_name: 'time'
    long_name: 'time'
    axis: "T"
    bounds: "time_bnds"
    calendar: "standard"
    units: 'seconds since 1970-01-01 00:00:00'

  time_bnds:
    long_name: "time bounds"
    units: 'seconds since 1970-01-01 00:00:00'

  time_offset_acquisition:
    standard_name: 'delta_time'
    long_name: "time since data acquisition"
    coordinates: "time longitude latitude"
    units: "days"
    grid_mapping: 'crs'
    comment: ""
