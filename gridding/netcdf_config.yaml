      #- "drift_unc"

  cv: # conventional
    histogram: True
    include:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_mode"
      - "dist_acquisition"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "dt_days"
      - "ice_conc"
      - "deformation"
      - "shear"
      - "divergence"
      - "snow_depth"
      - "sentinel3a"
      - "sentinel3b"
      - "cryosat2"
      - "sentinel3a_cnt"
      - "sentinel3b_cnt"
      - "cryosat2_cnt"
    rename:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_mode"
      - "dist_acquisition"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "time_offset_acquisition"
      - "sea_ice_concentration"
      - "deformation"
      - "shear"
