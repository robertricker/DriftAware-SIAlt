variable_attributes:
  xc:
    standard_name: "projection_x_coordinate"
    long_name: "x coordinate of projection (eastings)"
    units: "m"

  yc:
    standard_name: "projection_y_coordinate"
    long_name: "y coordinate of projection (northings)"
    units: "m"

  hist_bins:
    standard_name: "bin_centers"
    long_name: "histogram bin centers"
    units: "m"

  latitude:
    standard_name: "latitude"
    long_name: "latitude of grid cell center"
    units: "degrees_north"

  longitude:
    standard_name: "longitude"
    long_name: "time longitude of grid cell center"
    units: "degrees_east"

  sea_ice_concentration:
    standard_name: 'sea_ice_area_fraction'
    long_name: "sea ice concentration"
    coordinates: "time longitude latitude"
    units: "percent"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness:
    standard_name: 'sea_ice_thickness'
    long_name: "sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    ancillary_variables: "sea_ice_thickness_l2_unc sea_ice_thickness_drift_unc sea_ice_thickness_change_unc sea_ice_thickness_total_unc"
    comment: ""

  sea_ice_thickness_std:
    standard_name: 'sea_ice_thickness'
    long_name: "standard deviation of sea ice thickness estimates within parcel"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_mode:
    standard_name: 'sea_ice_thickness'
    long_name: "modal sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_hist:
    standard_name: 'sea_ice_thickness'
    long_name: "thickness classes between 0 m and 10 m with 0.25m bin size"
    coordinates: "time longitude latitude"
    units: "1"
    grid_mapping: 'crs'
    comment: "grid cells contain the absolute counts for each bin"

  sea_ice_thickness_change:
    long_name: "sea ice thickness change rate estimated along trajectories"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_change_interpolated:
    long_name: "spatially interpolated sea ice thickness change rate"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_drift_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the ice drift correction"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_change_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the interpolated thickness change correction"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_l2_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "sea ice thickness uncertainty associated with the level2 product"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_thickness_total_unc:
    standard_name: 'sea_ice_thickness standard_error'
    long_name: "combined sea ice thickness uncertainty"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  radar_freeboard:
    standard_name: 'radar_freeboard'
    long_name: "radar freeboard"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  sea_ice_freeboard:
    standard_name: 'sea_ice_freeboard'
    long_name: "sea ice freeboard"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  snow_depth:
    standard_name: 'surface_snow_thickness_where_sea_ice'
    long_name: "thickness of the snow layer"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  model_sea_ice_thickness:
    standard_name: 'sea_ice_thickness'
    long_name: "sea ice thickness propagated by the thermodynamic model"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: ""

  sea_ice_thickness_thermodynamic_tendency:
    standard_name: 'tendency_of_sea_ice_thickness_due_to_thermodynamics'
    long_name: "thermodynamic tendency of sea ice thickness inferred from observed thickness change and ice divergence"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    comment: ""

  model_sea_ice_thickness_change_rate:
    long_name: "modeled sea ice thickness correction rate along the trajectory direction"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: "The sign follows the forward or reverse trajectory direction."

  model_sea_ice_thickness_thermodynamic_tendency:
    standard_name: 'tendency_of_sea_ice_thickness_due_to_thermodynamics'
    long_name: "modeled forward-time thermodynamic tendency of sea ice thickness"
    coordinates: "time longitude latitude"
    units: "m day-1"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: ""

  model_air_temperature:
    standard_name: 'air_temperature'
    long_name: "air temperature used by the thermodynamic model"
    coordinates: "time longitude latitude"
    units: "degree_Celsius"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: ""

  model_ocean_heat_flux:
    long_name: "ocean heat flux used by the thermodynamic model"
    coordinates: "time longitude latitude"
    units: "W m-2"
    grid_mapping: 'crs'
    model: "winter_2layers"
    comment: "Positive values reduce modeled sea ice growth."

  sea_ice_displacement_uncertainty:
    long_name: "uncertainty of the accumulated sea ice parcel displacement along the trajectory"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  deformation:
    standard_name: 'deformation'
    long_name: "mean deformation accumulated along the trajectory"
    coordinates: "time longitude latitude"
    units: "1/day"
    grid_mapping: 'crs'
    comment: ""

  divergence:
    standard_name: 'divergence'
    long_name: "mean divergence accumulated along the trajectory"
    coordinates: "time longitude latitude"
    units: "1/day"
    grid_mapping: 'crs'
    comment: ""

  shear:
    standard_name: 'shear'
    long_name: "mean shear accumulated along the trajectory"
    coordinates: "time longitude latitude"
    units: "1/day"
    grid_mapping: 'crs'
    comment: ""

  dist_acquisition:
    standard_name: 'geospatial_distance'
    long_name: "distance between target day and day of data acquisition location"
    coordinates: "time longitude latitude"
    units: "m"
    grid_mapping: 'crs'
    comment: ""

  time:
    standard_name: 'time'
    long_name: 'time'
    axis: "T"
    bounds: "time_bnds"
    calendar: "standard"
    units: 'seconds since 1970-01-01 00:00:00'

  time_bnds:
    long_name: "time bounds"
    units: 'seconds since 1970-01-01 00:00:00'

  time_offset_acquisition:
    standard_name: 'delta_time'
    long_name: "time since data acquisition"
    coordinates: "time longitude latitude"
    units: "days"
    grid_mapping: 'crs'
    comment: ""
