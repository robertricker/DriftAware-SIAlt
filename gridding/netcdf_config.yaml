variables:
  da: # drift-aware
    histogram: True
    include:
      - "{{ target_var }}"
      - "{{ target_var }}_l2_unc"
      - "{{ target_var }}_drift_unc"
      - "{{ target_var }}_growth_unc"
      - "{{ target_var }}_total_unc"
      #- "{{ target_var }}_mode"
      - "{{ target_var }}_uncorrected"
      - "growth"
      - "growth_interpolated"
      - "dist_acquisition"
      - "dt_days"
      - "ice_conc"
      - "deformation"
      - "shear"
      - "divergence"
      - "dynamic_change_rate"
      - "thermo_change_rate"
      - "radar_freeboard"
      - "sea_ice_freeboard"
      - "snow_depth"
      - "sit_corr_thermo_mod"
      - "rate_thermo_change_mod"
      - "rate_thermo_growth_mod"
      - "drift_unc"
      - "ohf"
      - "t2m"
      - "sentinel3a"
      - "sentinel3b"
      - "cryosat2"
