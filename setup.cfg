[metadata]
name = driftaware-sialt
version = 0.1.0
description = Drift-aware processing of sea-ice altimetry observations
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
include_package_data = True
install_requires =
    astropy==6.0.1
    Cartopy==0.23.0
    geopandas==1.0.1
    h5py==3.14.0
    Jinja2==3.1.6
    loguru==0.7.3
    matplotlib==3.9.4
    netCDF4==1.7.2
    numpy==1.26.4
    pandas==2.3.3
    pyproj==3.6.1
    PyYAML==6.0.3
    scipy==1.13.1
    Shapely==2.0.7
    xarray==2024.7.0

[options.packages.find]
where = src

[options.package_data]
driftaware_sialt.gridding =
    netcdf_config.yaml
driftaware_sialt.volume =
    netcdf_config.yaml

[options.entry_points]
console_scripts =
    driftaware = driftaware_sialt.cli:main
